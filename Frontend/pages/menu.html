<!DOCTYPE html>
<html lang="vi" data-required-role="admin,staff,customer">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Menu - Hệ Thống Quản Lý Quán Cafe</title>
    <link rel="stylesheet" href="../css/style.css">
    <style>
        .menu-container {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 20px;
            padding: 20px;
        }

        .menu-item {
            background: white;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
            overflow: hidden;
            transition: all 0.3s;
        }

        .menu-item:hover {
            transform: translateY(-5px);
            box-shadow: 0 8px 16px rgba(0, 0, 0, 0.2);
        }

        .menu-image {
            width: 100%;
            height: 150px;
            background: linear-gradient(135deg, #8B4513, #A0522D);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 48px;
            color: white;
        }

        .menu-info {
            padding: 15px;
        }

        .menu-name {
            font-weight: 600;
            color: #333;
            margin-bottom: 8px;
        }

        .menu-category {
            font-size: 12px;
            color: #999;
            margin-bottom: 8px;
        }

        .menu-price {
            color: #8B4513;
            font-weight: 700;
            font-size: 16px;
            margin-bottom: 12px;
        }

        .menu-actions {
            display: flex;
            gap: 8px;
        }

        .btn-menu {
            flex: 1;
            padding: 8px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 12px;
            font-weight: 600;
            transition: all 0.3s;
        }

        .btn-menu.primary {
            background: linear-gradient(135deg, #8B4513 0%, #A0522D 100%);
            color: white;
        }

        .btn-menu.primary:hover {
            background: linear-gradient(135deg, #A0522D 0%, #8B4513 100%);
        }

        .btn-menu.secondary {
            background: #E0E0E0;
            color: #333;
        }

        .btn-menu.secondary:hover {
            background: #D0D0D0;
        }

        .category-filter {
            display: flex;
            gap: 12px;
            padding: 20px;
            flex-wrap: wrap;
            background: #F9F9F9;
            border-bottom: 1px solid #EEE;
        }

        .category-btn {
            padding: 8px 16px;
            border: 1px solid #DDD;
            background: white;
            border-radius: 20px;
            cursor: pointer;
            font-weight: 500;
            transition: all 0.3s;
        }

        .category-btn:hover,
        .category-btn.active {
            background: #8B4513;
            color: white;
            border-color: #8B4513;
        }
    </style>
</head>
<body>
    <!-- Navigation -->
    <nav class="navbar">
        <div class="navbar-brand">
            <img src="../images/Ảnh chụp màn hình 2026-04-17 105503.png" alt="HDTQ Coffee" class="navbar-logo-img">
            <span>COFFEE HDTQ</span>
        </div>
        <div class="navbar-menu">
            <a href="dashboard.html" class="nav-link">Trang Chủ</a>
            <a href="menu.html" class="nav-link active">Menu</a>
            <a href="order.html" class="nav-link">Đặt Hàng</a>
            <a href="payment.html" class="nav-link">Thanh Toán</a>
            <div class="navbar-user">
                <span id="user-name">User</span>
                <button class="btn-logout" onclick="logout()">Đăng Xuất</button>
            </div>
        </div>
    </nav>

    <!-- Category Filter -->
    <div class="category-filter">
        <button class="category-btn active" onclick="filterCategory('all')">Tất Cả</button>
        <button class="category-btn" onclick="filterCategory('coffee')">Cà Phê</button>
        <button class="category-btn" onclick="filterCategory('tea')">Trà Sữa</button>
        <button class="category-btn" onclick="filterCategory('juice')">Nước Uống</button>
        <button class="category-btn" onclick="filterCategory('snack')">Đồ Ăn</button>
    </div>

    <!-- Menu Items -->
    <div class="menu-container" id="menu-container">
        <!-- Items will be inserted here -->
    </div>

    <script src="../js/api.js"></script>
    <script src="../js/utils.js"></script>
    <script src="../js/auth.js"></script>

    <script>
        const MOCK_PRODUCTS = [
            { id: 1, name: 'Cà Phê Đen', category: 'coffee', icon: '☕', price: 25000, description: 'Cà phê nguyên chất' },
            { id: 2, name: 'Cà Phê Sữa', category: 'coffee', icon: '☕', price: 30000, description: 'Với sữa đặc' },
            { id: 3, name: 'Cà Phê Kem', category: 'coffee', icon: '🍦', price: 35000, description: 'Với kem tươi' },
            { id: 4, name: 'Espresso', category: 'coffee', icon: '☕', price: 20000, description: 'Cà phê đặc sánh' },
            { id: 5, name: 'Trà Sữa Trân Châu', category: 'tea', icon: '🍵', price: 28000, description: 'Trân châu đen' },
            { id: 6, name: 'Trà Sữa Thạch Coco', category: 'tea', icon: '🍹', price: 30000, description: 'Với thạch coco' },
            { id: 7, name: 'Nước Chanh', category: 'juice', icon: '🍋', price: 15000, description: 'Tươi mát' },
            { id: 8, name: 'Nước Dưa Hấu', category: 'juice', icon: '🍉', price: 18000, description: 'Mùa hè' },
            { id: 9, name: 'Bánh Mì', category: 'snack', icon: '🥖', price: 20000, description: 'Bánh mì thơm' },
            { id: 10, name: 'Bánh Quy', category: 'snack', icon: '🍪', price: 15000, description: 'Bánh quy giòn' }
        ];

        let currentCategory = 'all';

        function formatCurrency(amount) {
            return new Intl.NumberFormat('vi-VN', {
                style: 'currency',
                currency: 'VND'
            }).format(amount);
        }

        function loadMenu() {
            const container = document.getElementById('menu-container');
            const products = currentCategory === 'all'
                ? MOCK_PRODUCTS
                : MOCK_PRODUCTS.filter(p => p.category === currentCategory);

            container.innerHTML = products.map(product => `
                <div class="menu-item">
                    <div class="menu-image">${product.icon}</div>
                    <div class="menu-info">
                        <div class="menu-name">${product.name}</div>
                        <div class="menu-category">${product.category}</div>
                        <div class="menu-price">${formatCurrency(product.price)}</div>
                        <div class="menu-actions">
                            <button class="btn-menu primary" onclick="addToCart(${product.id}, '${product.name}', ${product.price})">Thêm</button>
                        </div>
                    </div>
                </div>
            `).join('');
        }

        function filterCategory(category) {
            currentCategory = category;
            document.querySelectorAll('.category-btn').forEach(btn => {
                btn.classList.remove('active');
            });
            event.target.classList.add('active');
            loadMenu();
        }

        function addToCart(id, name, price) {
            alert(`✓ Đã thêm "${name}" vào giỏ hàng!`);
        }

        function logout() {
            localStorage.removeItem('token');
            localStorage.removeItem('user');
            window.location.href = './login.html';
        }

        window.addEventListener('DOMContentLoaded', () => {
            const user = JSON.parse(localStorage.getItem('user') || '{}');
            document.getElementById('user-name').textContent = user.name || 'User';
            loadMenu();
        });
    </script>
</body>
</html>
