<!DOCTYPE html>
<html lang="vi" data-required-role="admin">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quản Lý Nhân Viên - Hệ Thống Quản Lý Quán Cafe</title>
    <link rel="stylesheet" href="../css/style.css">
    <style>
        .employees-container {
            padding: 20px;
            max-width: 1200px;
            margin: 0 auto;
        }

        .section-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            padding-bottom: 16px;
            border-bottom: 2px solid #8B4513;
        }

        .section-header h2 {
            font-size: 22px;
            color: #333;
            margin: 0;
        }

        .section-header button {
            background: linear-gradient(135deg, #8B4513 0%, #A0522D 100%);
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 600;
        }

        .section-header button:hover {
            background: #E67E00;
        }

        .table-container {
            background: white;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
            overflow: hidden;
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        thead {
            background: #F5F5F5;
            border-bottom: 2px solid #EEE;
        }

        th {
            padding: 12px 16px;
            text-align: left;
            font-weight: 600;
            color: #333;
            font-size: 13px;
            text-transform: uppercase;
        }

        td {
            padding: 12px 16px;
            border-bottom: 1px solid #EEE;
            color: #333;
        }

        tbody tr:hover {
            background: #F9F9F9;
        }

        .badge {
            display: inline-block;
            padding: 4px 8px;
            border-radius: 4px;
            font-size: 11px;
            font-weight: 600;
        }

        .badge.active {
            background: #D4EDDA;
            color: #155724;
        }

        .badge.inactive {
            background: #F8D7DA;
            color: #721C24;
        }

        .action-buttons {
            display: flex;
            gap: 6px;
        }

        .btn-action {
            padding: 4px 8px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 12px;
            font-weight: 500;
        }

        .btn-edit {
            background: #007BFF;
            color: white;
        }

        .btn-edit:hover {
            background: #0056B3;
        }

        .btn-delete {
            background: #DC3545;
            color: white;
        }

        .btn-delete:hover {
            background: #C82333;
        }
    </style>
</head>
<body>
    <!-- Navigation -->
    <nav class="navbar">
        <div class="navbar-brand">
            <img src="../images/Ảnh chụp màn hình 2026-04-17 105503.png" alt="HDTQ Coffee" class="navbar-logo-img">
            <span>COFFEE HDTQ</span>
        </div>
        <div class="navbar-menu">
            <a href="dashboard.html" class="nav-link">Trang Chủ</a>
            <a href="employees.html" class="nav-link active">Nhân Viên</a>
            <a href="reports.html" class="nav-link">Báo Cáo</a>
            <div class="navbar-user">
                <span id="user-name">Admin</span>
                <button class="btn-logout" onclick="logout()">Đăng Xuất</button>
            </div>
        </div>
    </nav>

    <div class="employees-container">
        <div class="section-header">
            <h2>👥 Quản Lý Nhân Viên</h2>
            <button onclick="addEmployee()">+ Thêm Nhân Viên</button>
        </div>

        <div class="table-container">
            <table id="employees-table">
                <thead>
                    <tr>
                        <th>ID</th>
                        <th>Tên Nhân Viên</th>
                        <th>Chức Vụ</th>
                        <th>Email</th>
                        <th>Điện Thoại</th>
                        <th>Trạng Thái</th>
                        <th>Hành Động</th>
                    </tr>
                </thead>
                <tbody>
                    <!-- Data will be inserted here -->
                </tbody>
            </table>
        </div>
    </div>

    <script>
        const MOCK_EMPLOYEES = [
            { id: 1, name: 'Trần Minh Quân', position: 'Quản Lý', email: 'quan@cafe.com', phone: '0912345678', status: 'active' },
            { id: 2, name: 'Nguyễn Văn An', position: 'Pha Chế', email: 'an@cafe.com', phone: '0987654321', status: 'active' },
            { id: 3, name: 'Lê Thị Hương', position: 'Pha Chế', email: 'huong@cafe.com', phone: '0909090909', status: 'active' },
            { id: 4, name: 'Phạm Văn Dũng', position: 'Phục Vụ', email: 'dung@cafe.com', phone: '0911111111', status: 'inactive' },
            { id: 5, name: 'Hoàng Thị Mai', position: 'Phục Vụ', email: 'mai@cafe.com', phone: '0922222222', status: 'active' }
        ];

        function loadEmployees() {
            const tbody = document.querySelector('#employees-table tbody');
            tbody.innerHTML = MOCK_EMPLOYEES.map(emp => `
                <tr>
                    <td>#${emp.id}</td>
                    <td>${emp.name}</td>
                    <td>${emp.position}</td>
                    <td>${emp.email}</td>
                    <td>${emp.phone}</td>
                    <td>
                        <span class="badge ${emp.status === 'active' ? 'active' : 'inactive'}">
                            ${emp.status === 'active' ? '✓ Hoạt Động' : '✕ Ngừng'}
                        </span>
                    </td>
                    <td>
                        <div class="action-buttons">
                            <button class="btn-action btn-edit" onclick="editEmployee(${emp.id})">Sửa</button>
                            <button class="btn-action btn-delete" onclick="deleteEmployee(${emp.id})">Xóa</button>
                        </div>
                    </td>
                </tr>
            `).join('');
        }

        function addEmployee() {
            alert('✓ Thêm nhân viên mới\n\nTính năng này sẽ được kích hoạt khi backend được triển khai.');
        }

        function editEmployee(id) {
            const employee = MOCK_EMPLOYEES.find(e => e.id === id);
            alert(`✓ Sửa nhân viên: ${employee.name}`);
        }

        function deleteEmployee(id) {
            if (confirm('Bạn chắc chắn muốn xóa?')) {
                alert('✓ Xóa thành công!');
            }
        }

        function logout() {
            localStorage.removeItem('token');
            localStorage.removeItem('user');
            window.location.href = './login.html';
        }

        window.addEventListener('DOMContentLoaded', () => {
            const user = JSON.parse(localStorage.getItem('user') || '{}');
            document.getElementById('user-name').textContent = user.name || 'Admin';
            loadEmployees();
        });
    </script>
</body>
</html>
